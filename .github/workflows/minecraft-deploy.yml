name: Minecraft deploy
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: 'Launcher operation ID (leave empty for manual runs)'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: portfolio-minecraft
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: infra/minecraft
    env:
      TF_INPUT: 'false'
      TF_IN_AUTOMATION: 'true'
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_accept_eula: ${{ vars.MINECRAFT_ACCEPT_EULA || 'false' }}
      TF_VAR_minecraft_version: ${{ vars.MINECRAFT_VERSION || '26.3' }}
      TF_VAR_fabric_loader_version: ${{ vars.FABRIC_LOADER_VERSION || '0.19.5' }}
      TF_VAR_fabric_installer_version: ${{ vars.FABRIC_INSTALLER_VERSION || '1.1.1' }}
      TF_VAR_fabric_api_version: ${{ vars.FABRIC_API_VERSION || '0.166.2+26.3' }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: minecraft-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Claim launcher operation
        env:
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
        run: python3 ../../.github/scripts/minecraft-control.py begin --action deploy
      - name: Verify required configuration
        run: |
          set -euo pipefail
          : "${TF_VAR_domain_name:?Missing DOMAIN_NAME}"
          : "${TF_VAR_cloudflare_zone_id:?Missing CLOUDFLARE_ZONE_ID}"
          : "${TF_VAR_cloudflare_api_token:?Missing CLOUDFLARE_API_TOKEN}"
          test "$TF_VAR_accept_eula" = true || { echo 'Accept the Minecraft EULA and set MINECRAFT_ACCEPT_EULA=true first.'; exit 1; }
      - name: Refuse to replace an existing server or world
        run: python3 ../../.github/scripts/minecraft-control.py ensure-offline
      - name: Initialize isolated Minecraft state
        run: terraform init -input=false -lockfile=readonly
      - name: Check Terraform
        run: |
          terraform fmt -check
          terraform validate
      - name: Check required game, Fabric and mod releases before provisioning
        run: python3 install-server.py --check "$TF_VAR_minecraft_version" "$TF_VAR_fabric_loader_version" "$TF_VAR_fabric_installer_version" "$TF_VAR_fabric_api_version"
      - name: Deploy server and DNS
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
      - name: Verify IPv6 DNS and Minecraft readiness
        run: python3 ../../.github/scripts/minecraft-control.py verify-deploy
      - name: Publish operation result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 ../../.github/scripts/minecraft-control.py finish --action deploy
