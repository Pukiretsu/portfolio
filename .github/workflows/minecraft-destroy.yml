name: Minecraft destroy
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: 'Launcher operation ID (leave empty for manual runs)'
        required: false
        type: string
      confirm_destroy:
        description: 'Permanently delete the Minecraft server AND its world data'
        required: true
        default: false
        type: boolean
      automatic:
        description: 'Internal idle cleanup: requires a fresh graceful-stop acknowledgement'
        required: false
        default: false
        type: boolean
      expected_instance_id:
        description: 'Instance ID for automatic cleanup (leave empty for manual runs)'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: portfolio-minecraft
  cancel-in-progress: false
jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: infra/minecraft
    env:
      TF_INPUT: 'false'
      TF_IN_AUTOMATION: 'true'
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_accept_eula: ${{ vars.MINECRAFT_ACCEPT_EULA || 'false' }}
      TF_VAR_minecraft_version: ${{ vars.MINECRAFT_VERSION || '1.21.11' }}
      TF_VAR_fabric_loader_version: ${{ vars.FABRIC_LOADER_VERSION || '0.18.4' }}
      TF_VAR_fabric_installer_version: ${{ vars.FABRIC_INSTALLER_VERSION || '1.1.1' }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: minecraft-destroy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Claim launcher operation
        env:
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
        run: python3 ../../.github/scripts/minecraft-control.py begin --action destroy
      - name: Initialize the same Minecraft state
        run: terraform init -input=false -lockfile=readonly
      - name: Validate Terraform and capture resource inventory
        env:
          INVENTORY_FILE: ${{ runner.temp }}/minecraft-destroy-inventory.json
        run: |
          terraform validate
          python3 ../../.github/scripts/minecraft-control.py snapshot
      - name: Verify automatic cleanup targets the stopped idle instance
        if: inputs.automatic
        env:
          INPUT_EXPECTED_INSTANCE_ID: ${{ inputs.expected_instance_id }}
        run: python3 ../../.github/scripts/minecraft-control.py verify-auto-shutdown
      - name: Destroy server, disks, network and DNS through Terraform
        run: terraform destroy -input=false -auto-approve -lock-timeout=5m
      - name: Verify complete teardown
        env:
          INVENTORY_FILE: ${{ runner.temp }}/minecraft-destroy-inventory.json
        run: python3 ../../.github/scripts/minecraft-control.py verify-destroy
      - name: Publish operation result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 ../../.github/scripts/minecraft-control.py finish --action destroy
